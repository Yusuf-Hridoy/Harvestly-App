name: harvestly
description: "Harvestly - a farm manager practice app for mobile test automation."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.4
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
