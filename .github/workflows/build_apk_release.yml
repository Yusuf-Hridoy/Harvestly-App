name: Build APK and publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check the signing secret is there
        env:
          KEYSTORE_BASE64: ${{ secrets.HARVESTLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The HARVESTLY_KEYSTORE_BASE64 secret is not set."
            echo "A release has to be signed with the real release key, so this build stops here."
            echo "See the Signing part of the README."
            exit 1
          fi

      - name: Put the release keystore in place
        env:
          KEYSTORE_BASE64: ${{ secrets.HARVESTLY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/harvestly-release.jks"
          chmod 600 "$RUNNER_TEMP/harvestly-release.jks"

      - name: Build the release APK
        env:
          HARVESTLY_KEYSTORE_PATH: ${{ runner.temp }}/harvestly-release.jks
          HARVESTLY_KEYSTORE_PASSWORD: ${{ secrets.HARVESTLY_KEYSTORE_PASSWORD }}
          HARVESTLY_KEY_ALIAS: ${{ secrets.HARVESTLY_KEY_ALIAS }}
          HARVESTLY_KEY_PASSWORD: ${{ secrets.HARVESTLY_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/harvestly-release.jks"

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk harvestly.apk

      - name: Read the version from pubspec.yaml
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}-build.${{ github.run_number }}
          name: Harvestly ${{ steps.version.outputs.number }} build ${{ github.run_number }}
          files: harvestly.apk
